<!-- Analytics + Session Replay + Web Experiment (unified smart loader) -->
<script src="https://cdn.amplitude.com/script/91a049dfcf02afc23c2aa2d43f1d3748.js"></script>
<!-- Guides & Surveys -->
<script src="https://cdn.amplitude.com/script/91a049dfcf02afc23c2aa2d43f1d3748.engagement.js"></script>
<!-- Bootstrap (SPEC §6.2) — inline and synchronous so the loader's own auto-init (autocapture on) can never win the
     race while the CDN is cached. js/analytics.js detects window.TSS_AMP ('inline' boot mode) and only adds its own
     geo + validation plugins. Keep the options identical to TSS.analytics INIT_OPTIONS. -->
<script>
(function (a) { if (!a) return;
  var b = window.TSS_AMP = { sr_added: false, engagement_added: false, ready: null };
  try { if (window.sessionReplay) { a.add(window.sessionReplay.plugin({ sampleRate: 1, privacyConfig: { defaultMaskLevel: 'medium' } })); b.sr_added = true; } } catch (e) {}
  try { if (window.engagement) { a.add(window.engagement.plugin()); b.engagement_added = true; } } catch (e) {}
  var r = a.init('91a049dfcf02afc23c2aa2d43f1d3748', { fetchRemoteConfig: true, autocapture: false, defaultTracking: false, identityStorage: 'sessionStorage' });
  b.ready = (r && r.promise) ? r.promise : Promise.resolve(r);
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) a.setOptOut(true);
})(window.amplitude);
</script>
